name: Arch Linux System Diagnostics
description: Core system information and health checks for Arch Linux
platform: arch_linux

tasks:
  - name: Kernel Version
    command: uname -a
    category: system

  - name: OS Release
    command: cat /etc/os-release
    category: system

  - name: Hostname Info
    command: hostnamectl
    category: system
    requires:
      - hostnamectl

  - name: CPU Info
    command: lscpu | head -30
    category: hardware
    max_lines: 30

  - name: Memory Usage
    command: free -h
    category: hardware

  - name: Disk Usage
    command: df -h
    category: hardware

  - name: Block Devices
    command: lsblk -o NAME,SIZE,TYPE,MOUNTPOINT,FSTYPE
    category: hardware

  - name: DMI / Machine Identity
    command: |
      read_dmi() {
        file="/sys/class/dmi/id/$1"
        if [ -r "$file" ]; then
          tr -d '\000' < "$file" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//'
        fi
      }
      clean_value() {
        value=$(printf '%s' "$1" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
        case "$value" in
          ""|"Not Applicable"|"N/A"|"n/a"|"None"|"none"|"System Product Name"|"System Version"|"Default string"|"Default String"|"To be filled by O.E.M."|"To Be Filled By O.E.M.")
            ;;
          *)
            printf '%s' "$value"
            ;;
        esac
      }
      append_unique() {
        list="$1"
        item="$2"
        if [ -z "$item" ]; then
          printf '%s' "$list"
        elif [ -z "$list" ]; then
          printf '%s' "$item"
        elif printf '%s\n' "$list" | grep -Fqx "$item"; then
          printf '%s' "$list"
        else
          printf '%s\n%s' "$list" "$item"
        fi
      }
      join_parts() {
        printf '%s\n' "$1" | awk 'NF { printf("%s%s", sep, $0); sep=" " } END { print "" }'
      }
      vendor=$(clean_value "$(read_dmi sys_vendor)")
      family=$(clean_value "$(read_dmi product_family)")
      product=$(clean_value "$(read_dmi product_name)")
      board_vendor=$(clean_value "$(read_dmi board_vendor)")
      board_name=$(clean_value "$(read_dmi board_name)")
      chassis_code=$(clean_value "$(read_dmi chassis_type)")
      chassis_label=""
      case "$chassis_code" in
        3) chassis_label="Desktop" ;;
        4) chassis_label="Low Profile Desktop" ;;
        6) chassis_label="Mini Tower" ;;
        7) chassis_label="Tower" ;;
        8) chassis_label="Portable" ;;
        9) chassis_label="Laptop" ;;
        10) chassis_label="Notebook" ;;
        11) chassis_label="Hand Held" ;;
        12) chassis_label="Docking Station" ;;
        13) chassis_label="All in One" ;;
        14) chassis_label="Sub Notebook" ;;
        15) chassis_label="Space-saving" ;;
        16) chassis_label="Lunch Box" ;;
        17) chassis_label="Main Server Chassis" ;;
        18) chassis_label="Expansion Chassis" ;;
        21) chassis_label="Peripheral Chassis" ;;
        23) chassis_label="Rack Mount Chassis" ;;
        24) chassis_label="Sealed-case PC" ;;
        30) chassis_label="Tablet" ;;
        31) chassis_label="Convertible" ;;
        32) chassis_label="Detachable" ;;
      esac
      if [ -n "$chassis_code" ] && [ -z "$chassis_label" ]; then
        chassis_label="Type $chassis_code"
      fi
      model_parts=""
      model_parts=$(append_unique "$model_parts" "$vendor")
      preferred_model="${product:-$family}"
      model_parts=$(append_unique "$model_parts" "$preferred_model")
      model=$(join_parts "$model_parts")
      board=""
      if [ -n "$board_vendor" ] && [ "$board_vendor" != "$vendor" ]; then
        board="$board_vendor"
      fi
      if [ -n "$board_name" ] && [ "$board_name" != "$product" ] && [ "$board_name" != "$family" ]; then
        if [ -n "$board" ]; then
          board="$board $board_name"
        else
          board="$board_name"
        fi
      fi
      if [ -z "$model" ]; then
        model="${board:-unknown}"
      fi
      if [ -n "$board" ] || [ -n "$chassis_label" ]; then
        extra=""
        if [ -n "$board" ]; then
          extra="$board"
        fi
        if [ -n "$chassis_label" ]; then
          lower_chassis=$(printf '%s' "$chassis_label" | tr '[:upper:]' '[:lower:]')
          if [ -n "$extra" ]; then
            extra="$extra $lower_chassis chassis"
          else
            extra="$lower_chassis chassis"
          fi
        fi
        if [ -n "$extra" ]; then
          model="$model ($extra)"
        fi
      fi
      echo "Model: $model"
      [ -n "$vendor" ] && echo "Vendor: $vendor"
      [ -n "$family" ] && [ "$family" != "$product" ] && echo "Family: $family"
      [ -n "$product" ] && echo "Product: $product"
      [ -n "$board" ] && echo "Board: $board"
      [ -n "$chassis_label" ] && echo "Chassis: $chassis_label"
      if command -v hostnamectl >/dev/null 2>&1; then
        hostnamectl 2>/dev/null | awk '
          /^[[:space:]]*Hardware Model:/ {
            sub(/^[[:space:]]+/, "", $0)
            print
          }'
      fi
    category: hardware
    max_lines: 15

  - name: Installed Packages Count
    command: pacman -Q | wc -l
    category: packages
    requires:
      - pacman

  - name: Explicitly Installed Packages
    command: pacman -Qe | head -100
    category: packages
    requires:
      - pacman
    max_lines: 100

  - name: Foreign Packages (AUR)
    command: pacman -Qm
    category: packages
    requires:
      - pacman
    max_lines: 100

  - name: Orphan Packages
    command: pacman -Qdt
    category: packages
    requires:
      - pacman

  - name: Failed Systemd Services
    command: systemctl --failed
    category: services
    requires:
      - systemctl

  - name: Running Services
    command: systemctl list-units --type=service --state=running --no-pager | head -50
    category: services
    requires:
      - systemctl
    max_lines: 50

  - name: Recent Boot Log
    command: journalctl -b -p err --no-pager | tail -50
    category: logs
    requires:
      - journalctl
    max_lines: 50

  - name: System Uptime
    command: uptime
    category: system

  - name: Loaded Kernel Modules
    command: lsmod | head -30
    category: system
    max_lines: 30

  - name: PCI Devices
    command: lspci
    category: hardware
    requires:
      - lspci
    max_lines: 50

  - name: USB Devices
    command: lsusb
    category: hardware
    requires:
      - lsusb
    max_lines: 30

  - name: Network Interfaces
    command: ip addr
    category: network
    requires:
      - ip

  - name: Network Routes
    command: ip route
    category: network
    requires:
      - ip

  - name: DNS Configuration
    command: cat /etc/resolv.conf
    category: network

  - name: Active Network Connections
    command: ss -tuln | head -30
    category: network
    requires:
      - ss
    max_lines: 30

  - name: Environment Variables
    command: env | grep -E '^(PATH|HOME|USER|SHELL|TERM|LANG|LC_|XDG_|DISPLAY|WAYLAND)' | sort
    category: environment
    max_lines: 30

